name: One-time EAS OTA - PR7

on:
  push:
    branches:
      - ops/ota-pr7-20261022
    paths:
      - .github/workflows/ota-pr7-20261022.yml

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Verify Expo authentication
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Repository secret EXPO_TOKEN is not configured."
            exit 1
          fi

      - name: Checkout merged production code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Activate Yarn 1
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Publish Android OTA to production
        run: >
          npx -y eas-cli@latest update
          --channel production
          --platform android
          --environment production
          --message "PR7 synchronized favorites GT and Sion"
          --non-interactive
