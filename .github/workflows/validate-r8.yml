name: Validate Android R8 configuration

on:
  push:
    branches:
      - fix/android-r8-minify-shrink
    paths:
      - .github/workflows/validate-r8.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/android-r8-minify-shrink

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Activate Yarn 1
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: Install and refresh lockfile
        run: yarn install --non-interactive

      - name: Expo Doctor
        run: npx expo-doctor

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Verify R8 and resource shrinking flags
        shell: bash
        run: |
          echo "=== gradle.properties ==="
          grep -nE "enableMinify|enableShrink|Proguard|shrinkResources" android/gradle.properties || true
          echo "=== app/build.gradle ==="
          grep -nE "minifyEnabled|shrinkResources|enableProguard" android/app/build.gradle || true

          if ! grep -Eq "android\.enableMinifyInReleaseBuilds=true|android\.enableProguardInReleaseBuilds=true" android/gradle.properties; then
            echo "::error::R8/minification flag was not generated as enabled."
            exit 1
          fi

          if ! grep -Eq "android\.enableShrinkResourcesInReleaseBuilds=true" android/gradle.properties; then
            echo "::error::Resource shrinking flag was not generated as enabled."
            exit 1
          fi

      - name: Commit refreshed yarn.lock
        shell: bash
        run: |
          git add yarn.lock
          if git diff --cached --quiet; then
            echo "yarn.lock already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync yarn lock for expo-build-properties"
          git push origin HEAD:fix/android-r8-minify-shrink
