name: Apply publication recovery fix

on:
  push:
    branches:
      - fix/publication-revision-recovery-20260913

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/publication-revision-recovery-20260913
          fetch-depth: 0

      - name: Apply targeted recovery patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/lib/api.ts')
          s = p.read_text(encoding='utf-8')
          original = s

          old = """async function publishContentPackageToService(\n  pkg: ContentPatchPackage,\n  password: string\n): Promise<void> {"""
          new = """async function publishContentPackageToService(\n  pkg: ContentPatchPackage,\n  password: string\n): Promise<'published' | 'revision_conflict'> {"""
          if old not in s:
              raise SystemExit('Expected publishContentPackageToService signature not found')
          s = s.replace(old, new, 1)

          old = """    if (code === 'invalid_patch') {\n      throw new Error(\n        'El servidor rechazó el paquete de actualización como inválido'\n      );\n    }\n\n    throw new Error("""
          new = """    if (code === 'invalid_patch') {\n      throw new Error(\n        'El servidor rechazó el paquete de actualización como inválido'\n      );\n    }\n\n    /*\n     * A publicação pode ter sido aceita pelo GitHub enquanto o\n     * aplicativo ainda enxerga um manifest anterior por cache/propagação.\n     * Nesse caso, uma segunda tentativa recebe revision_conflict.\n     * Não tratamos isso como sucesso ainda: devolvemos um estado explícito\n     * para que o chamador aguarde a revisão oficial e compare o pacote.\n     */\n    if (code === 'revision_conflict') {\n      return 'revision_conflict';\n    }\n\n    throw new Error("""
          if old not in s:
              raise SystemExit('Expected invalid_patch error block not found')
          s = s.replace(old, new, 1)

          old = """  }\n}\n\ntype OfficialContentManifest = {"""
          new = """  }\n\n  return 'published';\n}\n\ntype OfficialContentManifest = {"""
          if old not in s:
              raise SystemExit('Expected publish function closing block not found')
          s = s.replace(old, new, 1)

          old = """async function waitForOfficialContentRevision(\n  expectedRevision: number,\n  attempts = 10,\n  delayMs = 1500\n): Promise<void> {"""
          new = """async function waitForOfficialContentRevision(\n  expectedRevision: number,\n  attempts = 40,\n  delayMs = 1500\n): Promise<void> {"""
          if old not in s:
              raise SystemExit('Expected waitForOfficialContentRevision defaults not found')
          s = s.replace(old, new, 1)

          marker = """  return pkg as ContentPatchPackage;\n}\n\n/*\n * ADMFC — histórico permanente das revisões de conteúdo"""
          insert = """  return pkg as ContentPatchPackage;\n}\n\nasync function assertOfficialContentPackageMatches(\n  pkg: ContentPatchPackage\n): Promise<void> {\n  const manifest = await getOfficialContentManifest();\n  const filename = manifest.patches.find((item) => {\n    const match = item.match(/r(\\d+)\\.json$/i);\n    return match && Number(match[1]) === pkg.revision;\n  });\n\n  if (!filename) {\n    throw new Error(\n      `GitHub confirma R${String(pkg.revision).padStart(6, '0')}, pero no se encontró su archivo oficial`\n    );\n  }\n\n  const officialPkg = await getOfficialContentPackage(filename);\n\n  if (\n    officialPkg.schema_version !== pkg.schema_version ||\n    officialPkg.revision !== pkg.revision ||\n    !sameValue(officialPkg.patches, pkg.patches)\n  ) {\n    throw new Error(\n      `La revisión R${String(pkg.revision).padStart(6, '0')} ya existe en GitHub con contenido diferente. No se eliminó ninguna corrección local.`\n    );\n  }\n}\n\n/*\n * ADMFC — histórico permanente das revisões de conteúdo"""
          if marker not in s:
              raise SystemExit('Expected insertion marker after getOfficialContentPackage not found')
          s = s.replace(marker, insert, 1)

          old = """    if (officialRevision < pkg.revision) {\n      await publishContentPackageToService(\n        pkg,\n        password\n      );\n\n      await waitForOfficialContentRevision(\n        pkg.revision\n      );\n    }\n\n    return {\n      ok: true,\n      revision: pkg.revision,\n    };"""
          new = """    if (officialRevision < pkg.revision) {\n      await publishContentPackageToService(\n        pkg,\n        password\n      );\n\n      /*\n       * Mesmo quando o Worker responde revision_conflict, aguardamos o\n       * manifest oficial convergir. Isso cobre a janela em que a revisão\n       * já foi gravada no GitHub, mas o raw.githubusercontent ainda serve\n       * a versão anterior.\n       */\n      await waitForOfficialContentRevision(\n        pkg.revision\n      );\n    }\n\n    /*\n     * Antes de confirmar localmente, a revisão oficial precisa ser\n     * exatamente o mesmo pacote preparado no aparelho. Assim a recuperação\n     * é idempotente sem transformar um conflito real em falso sucesso.\n     */\n    await assertOfficialContentPackageMatches(pkg);\n\n    return {\n      ok: true,\n      revision: pkg.revision,\n    };"""
          if old not in s:
              raise SystemExit('Expected publishContentUpdate block not found')
          s = s.replace(old, new, 1)

          if s == original:
              raise SystemExit('No changes were applied')

          p.write_text(s, encoding='utf-8')
          PY

      - name: TypeScript check
        run: |
          npm ci
          npx tsc --noEmit

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/api.ts
          git commit -m "Fix idempotent content publication recovery"
          git push origin HEAD:fix/publication-revision-recovery-20260913
