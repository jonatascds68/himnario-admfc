name: Favorites regression
on:
  pull_request:
    paths:
      - 'src/lib/collections.ts'
      - 'src/screens/lists.tsx'
      - 'scripts/test-favorites.cjs'
      - '.github/workflows/favorites-regression.yml'
  workflow_dispatch:
jobs:
  favorites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund typescript@5.9.3
      - run: node scripts/test-favorites.cjs
