name: Sync canonical hymn base

on:
  push:
    branches: [main]
    paths:
      - 'updates/manifest.json'
      - 'updates/admfc-update-r*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-hymn-base
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Consolidate published content into canonical base
        run: node scripts/sync-canonical-base.mjs
      - name: Validate canonical base
        run: node scripts/sync-canonical-base.mjs --check
      - name: Commit canonical consolidation
        run: |
          if git diff --quiet -- assets/base_mestre.json; then
            echo "Canonical base already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/base_mestre.json
          git commit -m "Sync canonical hymn base with published content"
          git push
