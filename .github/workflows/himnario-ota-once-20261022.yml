name: Himnario OTA one-shot 20261022
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/himnario-ota-once-20261022.yml'
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure Expo token is configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not configured for this repository"
            exit 1
          fi
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate TypeScript
        run: npx tsc --noEmit
      - name: Publish OTA to production Android
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: '1'
        run: npx --yes eas-cli@latest update --branch production --platform android --environment production --message "Himnario ADMFC: favoritos sincronizados GT/Sion PR7" --non-interactive
