name: Harden categories and admin auth

on:
  push:
    branches:
      - fix/dynamic-category-refresh-20260913

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dynamic-category-refresh-20260913
          fetch-depth: 0

      - name: Apply targeted patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/api.ts')
          s = p.read_text(encoding='utf-8')
          original = s

          s = s.replace(
            "const ADMIN_PASSWORD_HASH = 'edf29432fb85857e36c029fffe09af9b1e02b1474dcc7b384fed25a121645900';",
            "const ADMIN_OFFLINE_PASSWORD_HASH_KEY =\n  'admfc_admin_offline_password_hash_v1';",
            1
          )

          marker = """function normalize(s: string) {
  return (s || '').normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').toLowerCase();
}
"""
          insert = marker + """
/*
 * Mantém o catálogo de categorias coerente com as categorias realmente
 * presentes nos hinos. Isso é essencial para categorias criadas depois
 * da instalação original e recebidas por atualização remota.
 */
function ensureCategoryCatalogFromHymns(db: LocalDb): boolean {
  let changed = false;

  for (const hymn of db.hymns) {
    for (const rawName of hymn.categorias || []) {
      const name = String(rawName || '').trim();
      if (!name) continue;

      const exists = db.categories.some(
        category => normalize(category.name) === normalize(name)
      );

      if (exists) continue;

      const slug =
        normalize(name).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') ||
        `category-${db.categories.length + 1}`;

      db.categories.push({
        id: `derived-${slug}`,
        name,
      });

      changed = true;
    }
  }

  return changed;
}
"""
          if marker not in s:
              raise SystemExit('normalize marker not found')
          s = s.replace(marker, insert, 1)

          old = """  await saveDb(nextDb);

  const validIds = new Set(nextDb.hymns.map(h => h.id));"""
          new = """  /*
   * Atualizações de conteúdo podem introduzir categorias que não existiam
   * quando o app foi instalado. O catálogo acompanha automaticamente os
   * hinos recebidos, sem depender de uma nova versão binária.
   */
  ensureCategoryCatalogFromHymns(nextDb);

  await saveDb(nextDb);

  const validIds = new Set(nextDb.hymns.map(h => h.id));"""
          if old not in s:
              raise SystemExit('saveDb nextDb marker not found')
          s = s.replace(old, new, 1)

          old = """  listCategories: async () => {
    const db = await loadDb();

    return {
      items: db.categories.map(category => ({
        ...category,
        count: categoryPreferredItems(
          db.hymns,
          category.name
        ).length,
      })),
    };
  },
  createCategory: async (name:string) => { requireAuth(); const db=await loadDb(); if(!db.categories.some(c=>normalize(c.name)===normalize(name))) db.categories.push({id:`cat-${Date.now()}`,name}); await saveDb(db); return {ok:true}; },
  renameCategory: async (id:string,name:string) => { requireAuth(); const db=await loadDb(); const c=db.categories.find(x=>x.id===id); if(!c) throw new Error('Categoría no encontrada'); const old=c.name; c.name=name; db.hymns.forEach(h=>{h.categorias=(h.categorias||[]).map(x=>x===old?name:x)}); await saveDb(db); return {ok:true}; },
  deleteCategory: async (id:string) => { requireAuth(); const db=await loadDb(); const c=db.categories.find(x=>x.id===id); if(c) db.hymns.forEach(h=>{h.categorias=(h.categorias||[]).filter(x=>x!==c.name)}); db.categories=db.categories.filter(x=>x.id!==id); await saveDb(db); return {ok:true}; },"""
          new = """  listCategories: async () => {
    const db = await loadDb();

    if (ensureCategoryCatalogFromHymns(db)) {
      await saveDb(db);
    }

    return {
      items: db.categories.map(category => ({
        ...category,
        count: categoryPreferredItems(
          db.hymns,
          category.name
        ).length,
      })),
    };
  },
  createCategory: async (name: string) => {
    requireAuth();

    const cleanName = String(name || '').trim();
    if (!cleanName) {
      throw new Error('El nombre de la categoría es obligatorio');
    }

    const db = await loadDb();

    if (
      db.categories.some(
        category => normalize(category.name) === normalize(cleanName)
      )
    ) {
      return { ok: true, existing: true };
    }

    db.categories.push({
      id: `cat-${Date.now()}`,
      name: cleanName,
    });

    await saveDb(db);
    return { ok: true, existing: false };
  },
  renameCategory: async (id: string, name: string) => {
    requireAuth();

    const cleanName = String(name || '').trim();
    if (!cleanName) {
      throw new Error('El nombre de la categoría es obligatorio');
    }

    const db = await loadDb();
    const category = db.categories.find(item => item.id === id);

    if (!category) {
      throw new Error('Categoría no encontrada');
    }

    if (
      db.categories.some(
        item =>
          item.id !== id &&
          normalize(item.name) === normalize(cleanName)
      )
    ) {
      throw new Error('Ya existe una categoría con ese nombre');
    }

    const oldName = category.name;
    const changedHymns: Array<{ before: Hymn; after: Hymn }> = [];

    for (const hymn of db.hymns) {
      if (!(hymn.categorias || []).includes(oldName)) continue;

      const before = JSON.parse(JSON.stringify(hymn)) as Hymn;

      hymn.categorias = (hymn.categorias || []).map(item =>
        item === oldName ? cleanName : item
      );

      changedHymns.push({
        before,
        after: JSON.parse(JSON.stringify(hymn)) as Hymn,
      });
    }

    category.name = cleanName;
    await saveDb(db);

    for (const { before, after } of changedHymns) {
      await registerHymnUpdate(before, after, {
        categorias: after.categorias,
      });
    }

    return { ok: true };
  },
  deleteCategory: async (id: string) => {
    requireAuth();

    const db = await loadDb();
    const category = db.categories.find(item => item.id === id);

    if (!category) {
      return { ok: true };
    }

    const changedHymns: Array<{ before: Hymn; after: Hymn }> = [];

    for (const hymn of db.hymns) {
      if (!(hymn.categorias || []).includes(category.name)) continue;

      const before = JSON.parse(JSON.stringify(hymn)) as Hymn;

      hymn.categorias = (hymn.categorias || []).filter(
        item => item !== category.name
      );

      changedHymns.push({
        before,
        after: JSON.parse(JSON.stringify(hymn)) as Hymn,
      });
    }

    db.categories = db.categories.filter(item => item.id !== id);
    await saveDb(db);

    for (const { before, after } of changedHymns) {
      await registerHymnUpdate(before, after, {
        categorias: after.categorias,
      });
    }

    return { ok: true };
  },"""
          if old not in s:
              raise SystemExit('category API block not found')
          s = s.replace(old, new, 1)

          old = """  // Administración local protegida por credencial fija.
  // La contraseña nunca se almacena en texto plano.
  login: async (email:string,password:string) => {
    if (!email || !password) throw new Error('Ingrese email y contraseña');

    const normalizedEmail = email.trim().toLowerCase();

    const passwordHash = await sha256(password);

    if (
      normalizedEmail !== ADMIN_EMAIL ||
      passwordHash !== ADMIN_PASSWORD_HASH
    ) {
      throw new Error('Credenciales incorrectas');
    }

    adminSession.set(`local-${Date.now()}`);
    return {
      access_token: adminSession.get(),
      local: true
    };
  },"""
          new = """  /*
   * Administración protegida sem segredo embutido no APK/AAB.
   *
   * A senha é validada pelo serviço ADMFC. Após uma autenticação online
   * bem-sucedida, guardamos SOMENTE um hash no SecureStore do aparelho
   * para permitir acesso administrativo offline no mesmo dispositivo.
   *
   * Uma resposta explícita de senha incorreta nunca usa fallback offline.
   */
  login: async (email: string, password: string) => {
    if (!email || !password) {
      throw new Error('Ingrese email y contraseña');
    }

    const normalizedEmail = email.trim().toLowerCase();

    if (normalizedEmail !== ADMIN_EMAIL) {
      throw new Error('Credenciales incorrectas');
    }

    const passwordHash = await sha256(password);

    try {
      await createHinarioPublicationSession(password);

      await secureKv.set(
        ADMIN_OFFLINE_PASSWORD_HASH_KEY,
        passwordHash
      );
    } catch (error: any) {
      if (
        error?.message ===
        'Contraseña administrativa incorrecta'
      ) {
        throw new Error('Credenciales incorrectas');
      }

      const offlinePasswordHash =
        await secureKv.get(
          ADMIN_OFFLINE_PASSWORD_HASH_KEY
        );

      if (
        !offlinePasswordHash ||
        offlinePasswordHash !== passwordHash
      ) {
        throw new Error(
          'No se pudo verificar la credencial administrativa. Conéctese a internet e intente nuevamente.'
        );
      }
    }

    adminSession.set(`verified-${Date.now()}`);

    return {
      access_token: adminSession.get(),
      local: true,
    };
  },"""
          if old not in s:
              raise SystemExit('login block not found')
          s = s.replace(old, new, 1)

          if s == original:
              raise SystemExit('No changes applied')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/api.ts
          git commit -m "Harden dynamic categories and admin authentication"
          git push origin HEAD:fix/dynamic-category-refresh-20260913
