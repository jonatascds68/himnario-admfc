name: Validate category and admin hardening

on:
  push:
    branches:
      - fix/dynamic-category-refresh-20260913

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile --non-interactive
      - run: npx tsc --noEmit
