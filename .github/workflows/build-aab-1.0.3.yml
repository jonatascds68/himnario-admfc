name: Build Himnario ADMFC 1.0.3 AAB

on:
  push:
    branches:
      - build/aab-1.0.3-20260918

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Install EAS CLI
        run: npm install --global eas-cli@21.8.0

      - name: Verify Expo authentication
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN secret is not configured in this repository."
            exit 2
          fi
          eas whoami --non-interactive

      - name: Build Android production AAB
        shell: bash
        run: |
          eas build             --platform android             --profile production             --non-interactive             --wait             --json | tee eas-build-result.json

      - name: Download generated AAB
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('eas-build-result.json', 'utf8').trim();
          const data = JSON.parse(raw);
          const build = Array.isArray(data) ? data[0] : data;
          const url = build?.artifacts?.applicationArchiveUrl || build?.artifacts?.buildUrl || build?.artifactUrl;
          if (!url) {
            console.error('AAB download URL not found in EAS output.');
            process.exit(1);
          }
          fs.writeFileSync('aab-url.txt', url + '\n');
          NODE
          curl --fail --location --retry 3             --output Himnario-ADMFC-1.0.3.aab             "$(cat aab-url.txt)"
          ls -lh Himnario-ADMFC-1.0.3.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Himnario-ADMFC-1.0.3-AAB
          path: |
            Himnario-ADMFC-1.0.3.aab
            eas-build-result.json
          if-no-files-found: error
          retention-days: 30
